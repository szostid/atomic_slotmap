[package]
name = "atomic_slotmap"
version = "1.0.1"
edition = "2018"
authors = ["Dawid Szostak <szostid@gmail.com>"]
description = "Lockfree slotmap data structure"
license = "MIT OR Apache-2.0"
repository = "https://github.com/szostid/atomic_slotmap"
readme = "README.md"
keywords = ["slotmap", "storage", "allocator", "arena", "lockfree"]
categories = ["data-structures", "memory-management", "caching"]
rust-version = "1.58.0"

[features]
default = ["lossy"]
lossy = []

[dependencies]
slotmap = "^1"

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dev-dependencies]
quickcheck = "1.0"
criterion = "0.5"
parking_lot = "0.12"
rand_chacha = "0.10"
rand = "0.10"

[[bench]]
name = "concurrency"
harness = false
