
[package]
name = "atomic-slotmap-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.0", features = ["arbitrary-derive"] }

[dependencies.atomic_slotmap]
path = ".."

[dependencies.slotmap]
version = "^1"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "atomic_slot_map"
path = "fuzz_targets/atomic_slot_map.rs"
test = false
doc = false
